<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>צ'אט פרטי - Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #111319;
      --panel: #1a1d26;
      --msg-me: #e8f0fe;
      --msg-them: #242836;
      --main-cyan: #00f2ff;
      --gold: #ffd700;
      --text-dark: #1f1f1f;
      --text-light: #e3e3e3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, system-ui, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text-light);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-tag {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(0, 242, 255, 0.1);
      color: var(--main-cyan);
    }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #0d0e12;
    }

    .msg-group { display: flex; gap: 10px; max-width: 75%; }
    .msg-group.me { align-self: flex-start; flex-direction: row; }
    .msg-group.them { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333745;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      color: var(--main-cyan);
    }

    .msg-body { display: flex; flex-direction: column; gap: 4px; }
    .msg-author { font-size: 0.75rem; color: #aaa; font-weight: bold; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-group.me .msg-bubble { background: var(--msg-me); color: var(--text-dark); border-bottom-right-radius: 4px; }
    .msg-group.them .msg-bubble { background: var(--msg-them); color: var(--text-light); border-bottom-left-radius: 4px; }
    .msg-img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 5px; }

    .input-wrapper { padding: 15px 20px; display: flex; align-items: center; gap: 10px; background: var(--bg); }
    .input-bar { flex: 1; background: #1e222d; border-radius: 25px; display: flex; align-items: center; padding: 5px 15px; gap: 10px; }
    .input-bar input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px 5px; font-size: 0.95rem; }

    .icon-btn { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 1.1rem; padding: 5px; }
    .icon-btn:hover { color: var(--main-cyan); }

    .action-circle-btn, .send-btn {
      width: 42px; height: 42px; border-radius: 50%; background: #2b3040; border: none;
      color: var(--main-cyan); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .send-btn:hover { background: var(--main-cyan); color: #000; }
  </style>
</head>
<body>

  <div class="chat-header">
    <span id="chat-title">צ'אט פרטי</span>
    <span class="status-tag" id="status-tag">מתחבר...</span>
  </div>

  <div class="messages-container" id="messages-list"></div>

  <div class="input-wrapper">
    <button class="action-circle-btn" onclick="document.getElementById('file-input').click()">+</button>
    <input type="file" id="file-input" style="display:none" accept="image/*" onchange="sendImage(this)">

    <div class="input-bar">
      <input type="text" id="chat-input" placeholder="הקלד הודעה..." onkeydown="handleKeyDown(event)">
      <button class="icon-btn" onclick="addEmoji('😊')">😊</button>
      <button class="icon-btn" onclick="addEmoji('👍')">👍</button>
    </div>

    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>

<script>
  const SUPABASE_URL = 'https://hvnfohlcvhjppoiejtvm.supabase.com';
  const SUPABASE_ANON_KEY = 'sb_publishable_B_KXyHYgS8Tsb0L-bm6sEw_nOyzzGyv';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const userName = prompt("הכנס את שמך לצ'אט:") || "אורח_" + Math.floor(Math.random() * 899 + 100);

  async function registerUser() {
    await supabase.from('users').insert([{ name: userName }]);
    document.getElementById('status-tag').textContent = `מחובר כ- ${userName}`;
  }

  async function loadInitialMessages() {
    const { data: msgs } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
    const list = document.getElementById('messages-list');
    list.innerHTML = '';
    if (msgs) {
      msgs.forEach(msg => renderMessage(msg, msg.sender === userName));
    }
  }

  function renderMessage(data, isMe) {
    const list = document.getElementById('messages-list');
    const group = document.createElement('div');
    group.className = `msg-group ${isMe ? 'me' : 'them'}`;

    let html = `
      <div class="avatar">${(data.sender || 'U').substr(0,2).toUpperCase()}</div>
      <div class="msg-body">
        <div class="msg-author">${isMe ? 'אני' : data.sender}</div>
        <div class="msg-bubble" style="${data.is_system ? 'background:var(--gold); color:#000; font-weight:bold;' : ''}">
          ${data.text ? escapeHtml(data.text) : ''}
          ${data.image ? `<br><img src="${data.image}" class="msg-img">` : ''}
        </div>
      </div>
    `;

    group.innerHTML = html;
    list.appendChild(group);
    list.scrollTop = list.scrollHeight;
  }

  function handleKeyDown(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    const { error } = await supabase.from('messages').insert([{ sender: userName, text: text }]);
    if (error) {
      console.error('שגיאה בשליחת ההודעה:', error);
    }
  }

  function sendImage(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      await supabase.from('messages').insert([{ sender: userName, image: e.target.result }]);
    };
    reader.readAsDataURL(file);
  }

  function addEmoji(e) {
    document.getElementById('chat-input').value += e;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  supabase.channel('chat-room')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      renderMessage(payload.new, payload.new.sender === userName);
    })
    .subscribe();

  registerUser();
  loadInitialMessages();
</script>
</body>
</html>
