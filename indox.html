<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>צ'אט פרטי וקבוצות</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #111319;
      --panel: #1a1d26;
      --msg-me: #00f2ff;
      --msg-me-text: #000;
      --msg-them: #242836;
      --msg-them-text: #fff;
      --main-cyan: #00f2ff;
      --text-light: #e3e3e3;
      --danger: #ff4d4d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, system-ui, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text-light);
      height: 100vh;
      width: 100vw;
      display: flex;
      overflow: hidden;
    }

    /* מסך כניסה */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(17, 19, 25, 0.95); display: flex;
      justify-content: center; align-items: center; z-index: 1000;
    }

    .login-box {
      background: var(--panel); padding: 30px; border-radius: 12px;
      text-align: center; box-shadow: 0 4px 20px rgba(0,242,255,0.15);
      border: 1px solid rgba(0, 242, 255, 0.2); width: 90%; max-width: 380px;
    }

    .login-box h2 { margin-bottom: 15px; color: var(--main-cyan); }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
      border: 1px solid #333; background: #0d0e12; color: #fff; font-size: 1rem; outline: none;
    }

    .login-box button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: var(--main-cyan); color: #000; font-weight: bold; font-size: 1rem; cursor: pointer;
    }

    /* סרגל צד */
    .sidebar {
      width: 280px; background: var(--panel); border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
    }

    .sidebar-header {
      padding: 15px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-between; align-items: center;
    }

    .rooms-list { flex: 1; overflow-y: auto; }

    .room-item {
      padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02);
      display: flex; align-items: center; justify-content: space-between;
    }

    .room-item:hover, .room-item.active {
      background: rgba(0, 242, 255, 0.08); color: var(--main-cyan);
    }

    .delete-room-btn {
      background: transparent; border: none; color: #888; font-weight: bold; cursor: pointer; padding: 2px 6px;
    }
    .delete-room-btn:hover { color: var(--danger); }

    .add-room-btn {
      background: transparent; border: 1px solid var(--main-cyan); color: var(--main-cyan);
      padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }

    /* אזור הצ'אט */
    .chat-area { flex: 1; display: flex; flex-direction: column; }

    .chat-header {
      padding: 12px 20px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-between; align-items: center;
    }

    .header-controls { display: flex; align-items: center; gap: 10px; }

    .lang-btn {
      background: #2b3040; color: var(--main-cyan); border: 1px solid var(--main-cyan);
      padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold;
    }

    .clear-btn {
      background: rgba(255, 77, 77, 0.15); color: var(--danger); border: 1px solid var(--danger);
      padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
    }
    .clear-btn:hover { background: var(--danger); color: #fff; }

    .status-tag {
      font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
      background: rgba(0, 242, 255, 0.1); color: var(--main-cyan);
    }

    /* עיצוב ההודעות המתוקן */
    .messages-container {
      flex: 1; padding: 20px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 15px; background: #0d0e12;
    }

    .msg-group { display: flex; gap: 10px; max-width: 75%; align-items: flex-start; }
    .msg-group.me { align-self: flex-start; flex-direction: row; }
    .msg-group.them { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 38px; height: 38px; border-radius: 50%; background: #2a2e3d;
      border: 1px solid var(--main-cyan); display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.85rem; color: var(--main-cyan); flex-shrink: 0;
    }

    .msg-body { display: flex; flex-direction: column; gap: 4px; }
    .msg-group.me .msg-body { align-items: flex-start; }
    .msg-group.them .msg-body { align-items: flex-end; }

    .msg-author { font-size: 0.75rem; color: #888; font-weight: bold; padding: 0 4px; }

    .msg-bubble {
      padding: 10px 16px; border-radius: 16px; font-size: 0.95rem;
      line-height: 1.4; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .msg-group.me .msg-bubble {
      background: var(--msg-me); color: var(--msg-me-text); border-top-right-radius: 2px; font-weight: 500;
    }

    .msg-group.them .msg-bubble {
      background: var(--msg-them); color: var(--msg-them-text); border-top-left-radius: 2px;
    }

    .msg-img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 5px; }

    .input-wrapper { padding: 15px 20px; display: flex; align-items: center; gap: 10px; background: var(--bg); }
    .input-bar { flex: 1; background: #1e222d; border-radius: 25px; display: flex; align-items: center; padding: 5px 15px; gap: 10px; }
    .input-bar input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px 5px; font-size: 0.95rem; }

    .icon-btn { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 1.1rem; padding: 5px; }
    .icon-btn:hover { color: var(--main-cyan); }

    .action-circle-btn, .send-btn {
      width: 42px; height: 42px; border-radius: 50%; background: #2b3040; border: none;
      color: var(--main-cyan); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .send-btn:hover { background: var(--main-cyan); color: #000; }
  </style>
</head>
<body>

  <!-- מסך כניסה -->
  <div id="login-overlay">
    <div class="login-box">
      <h2 id="txt-login-title">התחברות לצ'אט</h2>
      <input type="text" id="username-input" placeholder="הכנס את שמך..." onkeydown="if(event.key==='Enter') login()">
      <button id="txt-login-btn" onclick="login()">הכנס לצ'אט</button>
    </div>
  </div>

  <!-- סרגל צד -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span id="txt-sidebar-title">חדרים וקבוצות</span>
      <button class="add-room-btn" id="txt-add-room" onclick="createNewRoom()">+ קבוצה חדשה</button>
    </div>
    <div class="rooms-list" id="rooms-list"></div>
  </div>

  <!-- אזור צ'אט ראשי -->
  <div class="chat-area">
    <div class="chat-header">
      <span id="chat-title">בחר קבוצה</span>
      <div class="header-controls">
        <button class="lang-btn" onclick="toggleLanguage()">EN / עברית</button>
        <button class="clear-btn" id="txt-clear-btn" onclick="clearCurrentRoom()">מחק היסטוריה</button>
        <span class="status-tag" id="status-tag">מתחבר...</span>
      </div>
    </div>

    <div class="messages-container" id="messages-list"></div>

    <div class="input-wrapper">
      <button class="action-circle-btn" onclick="document.getElementById('file-input').click()">+</button>
      <input type="file" id="file-input" style="display:none" accept="image/*" onchange="sendImage(this)">

      <div class="input-bar">
        <input type="text" id="chat-input" placeholder="הקלד הודעה..." onkeydown="handleKeyDown(event)">
        <button class="icon-btn" onclick="addEmoji('😊')">😊</button>
        <button class="icon-btn" onclick="addEmoji('👍')">👍</button>
      </div>

      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

<script>
  const firebaseConfig = {
    databaseURL: "https://chat-63ae6-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let userName = localStorage.getItem('chat_username') || '';
  let currentLang = localStorage.getItem('chat_lang') || 'he';
  let currentRoom = null;
  let activeListener = null;

  const translations = {
    he: {
      loginTitle: "התחברות לצ'אט",
      loginPlaceholder: "הכנס את שמך...",
      loginBtn: "הכנס לצ'אט",
      sidebarTitle: "חדרים וקבוצות",
      addRoom: "+ קבוצה חדשה",
      clearHistory: "מחק היסטוריה",
      typeMsg: "הקלד הודעה...",
      connectedAs: "מחובר כ- ",
      roomPrefix: "קבוצה: ",
      promptNewRoom: "הכנס שם לקבוצה/שיחה חדשה:",
      confirmDeleteRoom: "האם למחוק את הקבוצה הזו ואת כל ההודעות בה?",
      confirmClearChat: "האם למחוק את כל ההודעות בשיחה זו?",
      me: "אני"
    },
    en: {
      loginTitle: "Login to Chat",
      loginPlaceholder: "Enter your name...",
      loginBtn: "Enter Chat",
      sidebarTitle: "Rooms & Groups",
      addRoom: "+ New Group",
      clearHistory: "Clear History",
      typeMsg: "Type a message...",
      connectedAs: "Connected as ",
      roomPrefix: "Group: ",
      promptNewRoom: "Enter new group name:",
      confirmDeleteRoom: "Delete this group and all its messages?",
      confirmClearChat: "Clear all messages in this room?",
      me: "Me"
    }
  };

  applyLanguage();

  if (userName) {
    document.getElementById('login-overlay').style.display = 'none';
    initChat();
  }

  function toggleLanguage() {
    currentLang = currentLang === 'he' ? 'en' : 'he';
    localStorage.setItem('chat_lang', currentLang);
    applyLanguage();
  }

  function applyLanguage() {
    const t = translations[currentLang];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'he' ? 'rtl' : 'ltr';

    document.getElementById('txt-login-title').textContent = t.loginTitle;
    document.getElementById('username-input').placeholder = t.loginPlaceholder;
    document.getElementById('txt-login-btn').textContent = t.loginBtn;
    document.getElementById('txt-sidebar-title').textContent = t.sidebarTitle;
    document.getElementById('txt-add-room').textContent = t.addRoom;
    document.getElementById('txt-clear-btn').textContent = t.clearHistory;
    document.getElementById('chat-input').placeholder = t.typeMsg;

    if (userName) {
      document.getElementById('status-tag').textContent = t.connectedAs + userName;
    }
    if (currentRoom) {
      document.getElementById('chat-title').textContent = t.roomPrefix + currentRoom;
    }
  }

  function login() {
    const input = document.getElementById('username-input').value.trim();
    if (!input) return alert("Please enter a valid name / הכנס שם תקין");
    
    userName = input;
    localStorage.setItem('chat_username', userName);
    document.getElementById('login-overlay').style.display = 'none';
    initChat();
  }

  function initChat() {
    applyLanguage();
    listenToRoomsList();
  }

  function listenToRoomsList() {
    db.ref('rooms').on('value', (snapshot) => {
      const rooms = snapshot.val() || {};
      const list = document.getElementById('rooms-list');
      list.innerHTML = '';

      if (Object.keys(rooms).length === 0) {
        db.ref('rooms/כללי').set({ createdBy: 'system' });
        return;
      }

      let roomKeys = Object.keys(rooms);
      roomKeys.forEach(roomName => {
        const item = document.createElement('div');
        item.className = 'room-item';
        item.id = `room-item-${roomName}`;
        if (currentRoom === roomName) item.classList.add('active');
        item.onclick = function() { switchRoom(roomName); };
        item.innerHTML = `
          <span># ${escapeHtml(roomName)}</span>
          <button class="delete-room-btn" onclick="deleteRoom(event, '${roomName}')">✕</button>
        `;
        list.appendChild(item);
      });

      if (!currentRoom || !rooms[currentRoom]) {
        switchRoom(roomKeys[0]);
      }
    });
  }

  function createNewRoom() {
    const t = translations[currentLang];
    const roomName = prompt(t.promptNewRoom);
    if (!roomName) return;

    db.ref('rooms/' + roomName).set({ createdBy: userName }).then(() => {
      switchRoom(roomName);
    });
  }

  function deleteRoom(event, roomName) {
    event.stopPropagation();
    const t = translations[currentLang];
    if (!confirm(t.confirmDeleteRoom)) return;

    db.ref('rooms/' + roomName).remove();
    db.ref('messages/' + roomName).remove();
  }

  function clearCurrentRoom() {
    if (!currentRoom) return;
    const t = translations[currentLang];
    if (!confirm(t.confirmClearChat)) return;

    db.ref('messages/' + currentRoom).remove().then(() => {
      document.getElementById('messages-list').innerHTML = '';
    });
  }

  function switchRoom(roomName) {
    currentRoom = roomName;
    const t = translations[currentLang];
    document.getElementById('chat-title').textContent = t.roomPrefix + roomName;
    
    document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
    const activeElem = document.getElementById(`room-item-${roomName}`);
    if (activeElem) activeElem.classList.add('active');

    listenToMessages(roomName);
  }

  function listenToMessages(roomName) {
    const list = document.getElementById('messages-list');
    list.innerHTML = '';

    if (activeListener) {
      db.ref('messages/' + activeListener).off();
    }
    activeListener = roomName;

    db.ref('messages/' + roomName).on('child_added', (snapshot) => {
      const msg = snapshot.val();
      renderMessage(msg, msg.sender === userName);
    });

    db.ref('messages/' + roomName).on('value', (snapshot) => {
      if (!snapshot.exists()) {
        list.innerHTML = '';
      }
    });
  }

  function renderMessage(data, isMe) {
    const list = document.getElementById('messages-list');
    const t = translations[currentLang];
    const group = document.createElement('div');
    group.className = `msg-group ${isMe ? 'me' : 'them'}`;

    let html = `
      <div class="avatar">${(data.sender || 'U').substr(0,2).toUpperCase()}</div>
      <div class="msg-body">
        <div class="msg-author">${isMe ? t.me : escapeHtml(data.sender)}</div>
        <div class="msg-bubble">
          ${data.text ? escapeHtml(data.text) : ''}
          ${data.image ? `<br><img src="${data.image}" class="msg-img">` : ''}
        </div>
      </div>
    `;

    group.innerHTML = html;
    list.appendChild(group);
    list.scrollTop = list.scrollHeight;
  }

  function handleKeyDown(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      sendMessage();
    }
  }

  function sendMessage() {
    if (!currentRoom) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    db.ref('messages/' + currentRoom).push({
      sender: userName,
      text: text
    });
  }

  function sendImage(fileInput) {
    if (!currentRoom) return;
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      db.ref('messages/' + currentRoom).push({
        sender: userName,
        image: e.target.result
      });
    };
    reader.readAsDataURL(file);
  }

  function addEmoji(e) {
    document.getElementById('chat-input').value += e;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
