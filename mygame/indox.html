<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>צ'אט</title>
    <!-- 1. טעינת הספריה של Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
      // 2. פרטי ההתחברות מ-Supabase
      const SUPABASE_URL = 'https://hvnfohlcvhjppoiejtvm.supabase.com';
      const SUPABASE_KEY = 'sb_publishable_B_KXyHYgS8Tsb0L-bm6sEw_nOyzzGyv';
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function initUser() {
        const userId = "user_" + Math.floor(Math.random() * 1000);
        const userName = prompt("הכנס שם:") || "אורח";

        // 3. הכנסת משתמש חדש לטבלה 'users'
        const { error } = await supabase
          .from('users')
          .insert([
            { id: userId, name: userName, status: "online" }
          ]);

        if (error) {
          console.error("שגיאה בשמירת המשתמש:", error);
        }
      }

      window.onload = function() {
        initUser();
      };
    </script>
</head>
<body>
    <h2>התחברת לצ'אט בהצלחה!</h2>
</body>
</html>
